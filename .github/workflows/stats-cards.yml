name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0 点（北京时间 8 点）更新一次
  workflow_dispatch:       # 支持手动触发
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 生成统计卡片（清爽浅色主题）
      # 注意：stats 卡片需要能读取你所有公开仓库的提交/PR/ISSUE 数据，
      # 因此 token 必须使用带有 repo + read:user 权限的 Personal Access Token（PAT），
      # 并在仓库 Settings → Secrets → Actions 中命名为 PAT_1。
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&hide_border=true
            &bg_color=ffffff&title_color=0f172a&icon_color=0ea5e9&text_color=334155&ring_color=0ea5e9
          path: profile/stats.svg
          token: ${{ secrets.PAT_1 }}

      # 生成 Top Languages 卡片
      - name: Generate top-langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=compact&hide_border=true
            &bg_color=ffffff&title_color=0f172a&text_color=334155&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_1 }}

      # 提交生成的 SVG 到 main 分支
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
